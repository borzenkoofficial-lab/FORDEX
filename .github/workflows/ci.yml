name: FORDEX CI

on:
  push:
    branches: [main, "launch/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:ranking
      - run: npm run verify:data
      - run: npm run verify:agent
      - run: npm run verify:ai-editor
      - run: npm run verify:model
      - run: npm run verify:proposal-gate
      - run: npm run verify:runtime
      - run: npm run verify:live-market
      - run: npm run verify:ai-research
      - run: npm run verify:security
      - run: npm run verify:seo
      - run: SITE_URL=https://fordex.example.invalid npm run build
      - run: SITE_URL=https://fordex.example.invalid npm run verify:seo:output
