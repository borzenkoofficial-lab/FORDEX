name: FORDEX CI\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm install --no-audit --no-fund\n      - run: npm run verify:ranking\n      - run: npm run verify:data\n      - run: npm run verify:agent\n      - run: npm run verify:model\n      - run: npm run verify:runtime\n      - run: npm run build\n